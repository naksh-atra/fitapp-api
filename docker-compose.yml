version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: fitapp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fitapp-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=fitapp
    depends_on:
      - mongo
    env_file:
      - .env.local

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fitapp-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    env_file:
      - .env.local

volumes:
  mongo-data:
